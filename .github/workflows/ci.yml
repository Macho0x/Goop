name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Go unit tests
        run: go test ./...

      - name: Build
        run: go build -o /tmp/goop ./cmd/goop

      - name: Sig corpus smoke
        run: |
          export GOOP_HOME="${RUNNER_TEMP}/goop-home"
          mkdir -p "$GOOP_HOME"
          /tmp/goop gen-sig --smoke
          /tmp/goop gen-sig strings os path/filepath
          # Fixed import corpus must typecheck with auto-loaded stubs
          /tmp/goop check ../docs/examples/writing_tools.goop
          /tmp/goop check ../docs/examples/maps.goop

      - name: End-to-end tests
        run: |
          /tmp/goop test ../tests/

      - name: Check all examples
        run: |
          for f in ../docs/examples/*.goop; do
            /tmp/goop check "$f"
          done

      - name: Cache-only build smoke
        run: |
          export GOOP_HOME="${RUNNER_TEMP}/goop-home"
          mkdir -p "$GOOP_HOME"
          /tmp/goop build ../docs/examples/hello.goop
          test -x ./goop-out
          ./goop-out | grep -q Hello
          rm -f ./goop-out
          # Default build must not leave generated Go beside examples
          if ls ../docs/examples/*.go >/dev/null 2>&1; then
            echo "unexpected .go files left in docs/examples:"
            ls ../docs/examples/*.go
            exit 1
          fi
          if ls ../docs/examples/*.map.json >/dev/null 2>&1; then
            echo "unexpected map files left in docs/examples:"
            ls ../docs/examples/*.map.json
            exit 1
          fi

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Go unit tests
        run: go test ./...

      - name: Build CLI
        run: go build -o goop.exe ./cmd/goop

      # Full `goop test` e2e is Linux-oriented (shell paths); keep a small smoke
      # subset here: type-check one example and a cache-only build.
      - name: Check hello example
        run: ./goop.exe check ../docs/examples/hello.goop

      - name: Cache-only build smoke
        shell: pwsh
        run: |
          $env:GOOP_HOME = Join-Path $env:RUNNER_TEMP "goop-home"
          New-Item -ItemType Directory -Force -Path $env:GOOP_HOME | Out-Null
          ./goop.exe build ../docs/examples/hello.goop
          if (-not (Test-Path ./goop-out.exe)) {
            throw "expected goop-out.exe after build"
          }
          $out = & ./goop-out.exe
          if ($out -notmatch "Hello") {
            throw "unexpected goop-out output: $out"
          }
          Remove-Item -Force ./goop-out.exe
          $strayGo = Get-ChildItem ../docs/examples/*.go -ErrorAction SilentlyContinue
          if ($strayGo) {
            throw "unexpected .go files left in docs/examples: $($strayGo.Name -join ', ')"
          }
          $strayMaps = Get-ChildItem ../docs/examples/*.map.json -ErrorAction SilentlyContinue
          if ($strayMaps) {
            throw "unexpected map files left in docs/examples: $($strayMaps.Name -join ', ')"
          }
