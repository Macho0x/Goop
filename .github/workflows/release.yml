name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build Linux (amd64)
        run: |
          cd src
          go build -o goop-linux-amd64 -ldflags="-s -w" ./cmd/goop

      - name: Build macOS (amd64)
        run: |
          cd src
          GOOS=darwin GOARCH=amd64 go build -o goop-darwin-amd64 -ldflags="-s -w" ./cmd/goop

      - name: Build macOS (arm64)
        run: |
          cd src
          GOOS=darwin GOARCH=arm64 go build -o goop-darwin-arm64 -ldflags="-s -w" ./cmd/goop

      - name: Build Windows (amd64)
        run: |
          cd src
          GOOS=windows GOARCH=amd64 go build -o goop-windows-amd64.exe -ldflags="-s -w" ./cmd/goop

      - name: Package VS Code extension
        run: |
          cd editors/vscode
          npm install --omit=dev
          npx --yes @vscode/vsce package --out "../../goop-${{ steps.version.outputs.version }}.vsix"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Goop ${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: |
            src/goop-linux-amd64
            src/goop-darwin-amd64
            src/goop-darwin-arm64
            src/goop-windows-amd64.exe
            goop-${{ steps.version.outputs.version }}.vsix

      - name: Publish to VS Marketplace (optional)
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "VSCE_PAT not set — skipping Marketplace publish"
            exit 0
          fi
          cd editors/vscode
          npx --yes @vscode/vsce publish --packagePath "../../goop-${{ steps.version.outputs.version }}.vsix"

      - name: Publish to Open VSX (optional)
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
        run: |
          if [ -z "$OVSX_TOKEN" ]; then
            echo "OVSX_TOKEN not set — skipping Open VSX publish"
            exit 0
          fi
          npx --yes ovsx publish "goop-${{ steps.version.outputs.version }}.vsix" -p "$OVSX_TOKEN"
